nputs"><div class="field"><label for="start">◷ &nbsp; Startzeit</label><input id="start" type="time" value="08:00"></div><div class="field"><label for="end">◷ &nbsp; Endzeit</label><input id="end" type="time" value="11:25"></div><div class="field"><label for="count">▤ &nbsp; Anzahl Aufträge</label><div class="counter"><button id="minus" aria-label="Auftrag weniger">−</button><input id="count" type="number" min="1" max="500" value="5" inputmode="numeric"><button id="plus" aria-label="Auftrag mehr">+</button></div></div></div><div class="total"><span class="clock">◷</span><div><small>Gesamtzeit</small><strong id="duration">3 h 25 min</strong><small id="details">205 Minuten · 5 Aufträge</small></div></div><button class="primary" id="calculate">▦ &nbsp; Automatisch berechnen</button><div class="note">Die Zeiten werden gleichmässig auf alle Aufträge verteilt. Änderungen werden automatisch berechnet.</div><div class="results"><h2>Auftragsübersicht</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>Anfang</th><th>Ende</th><th>Dauer</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="copyAll">▢ &nbsp; Tabelle kopieren</button><button id="copyTimes">☷ &nbsp; Nur Zeiten kopieren</button><button id="reset">↻ &nbsp; Zurücksetzen</button></div><div id="message" class="message" role="status">✓ Zeiten wurden verteilt.</div></div></section><p class="footer">SAV Calculator v2 · Offline nutzbar</p></main><script>
const $=id=>document.getElementById(id);let result=[];function mins(t){const a=t.split(':').map(Number);return a.length===2&&a.every(Number.isFinite)?a[0]*60+a[1]:null}function time(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function duration(m){return m>=60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`:`${m} min`}function calc(){let a=mins($('start').value),b=mins($('end').value),n=Number($('count').value);if(a===null||b===null||!Number.isInteger(n)||n<1||n>500){$('message').textContent='Bitte gültige Zeiten und 1–500 Aufträge eingeben.';$('message').classList.add('error');return}if(b<=a)b+=1440;const total=b-a,base=Math.floor(total/n),rem=total%n;result=[];let cursor=a;for(let i=0;i<n;i++){let d=base+(i<rem?1:0);result.push([i+1,time(cursor),time(cursor+d),duration(d)]);cursor+=d}$('duration').textContent=duration(total);$('details').textContent=`${total} Minuten · ${n} Aufträge`;$('rows').replaceChildren(...result.map(r=>{const tr=document.createElement('tr');r.forEach((v,i)=>{const td=document.createElement('td');if(i===1||i===2){const c=document.createElement('code');c.textContent=v;td.append(c)}else td.textContent=v;tr.append(td)});return tr}));$('message').textContent='✓ Zeiten wurden verteilt.';$('message').classList.remove('error');try{localStorage.setItem('sav-v2',JSON.stringify({start:$('start').value,end:$('end').value,count:n}))}catch(e){}}async function copy(s){try{await navigator.clipboard.writeText(s)}catch(e){const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove()}$('message').textContent='✓ In Zwischenablage kopiert.'}['start','end','count'].forEach(id=>{$(id).addEventListener('input',calc);$(id).addEventListener('change',calc)});$('minus').onclick=()=>{$('count').value=Math.max(1,(Number($('count').value)||1)-1);calc()};$('plus').onclick=()=>{$('count').value=Math.min(500,(Number($('count').value)||0)+1);calc()};$('calculate').onclick=calc;$('copyAll').onclick=()=>copy('Auftrag\tAnfang\tEnde\tDauer\n'+result.map(r=>r.join('\t')).join('\n'));$('copyTimes').onclick=()=>copy(result.map(r=>`${r[1]} – ${r[2]}`).join('\n'));$('reset').onclick=()=>{$('start').value='08:00';$('end').value='11:25';$('count').value=5;calc()};try{const s=JSON.parse(localStorage.getItem('sav-v2')||'null');if(s){$('start').value=s.start||'08:00';$('end').value=s.end||'11:25';$('count').value=s.count||5}}catch(e){}calc();
